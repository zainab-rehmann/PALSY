# PALSY CI — runs on every push to master and every pull request.
# Catches a broken build here, with a clear red/green status on the
# commit, instead of only failing later on Vercel. Build-only: no
# secrets, tokens, or credentials are used.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 matches Vercel's default build runtime for this project.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Reported but non-blocking: the codebase has pre-existing lint
      # errors (60 at last count) that are being cleaned up separately.
      - name: Lint (report only)
        run: npx eslint .
        continue-on-error: true

      - name: Production build
        run: npm run build
